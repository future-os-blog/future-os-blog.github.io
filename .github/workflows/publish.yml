name: Publish Blog

# Serves https://future-os-blog.github.io from the sources in
# https://github.com/futuregene/future-os (docs/blog/).
#
# This repository owns the Pages site, so the build has to run *here* — Pages
# artifacts can only be deployed by the repository that owns them. The sources
# are public, so the build clones them anonymously: no token, no secret, nothing
# to rotate. The trade-off is that publishing is pull-based, so a new post goes
# live at the next scheduled run (or immediately via `gh workflow run`).
#
# `workflow_dispatch` with a `ref` input builds any branch — that is the way to
# preview blog changes before they land on main:
#   gh workflow run publish.yml -f ref=docs/some-branch

on:
  schedule:
    # Not on the hour: GitHub's scheduler is busiest at :00 and drops jobs there.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA of futuregene/future-os to build
        default: main
        required: false
  # Optional fast path: a push in future-os can trigger an immediate rebuild if
  # it dispatches `future-os-push`. The default GITHUB_TOKEN cannot dispatch to
  # another repository, so this needs a fine-grained PAT for futuregene/future-os
  # with `contents: read` + `metadata: read`. Until then, the schedule covers it.
  repository_dispatch:
    types: [future-os-push]
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "CNAME"

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a run that is mid-publish, or Pages can be left serving a
# half-uploaded artifact.
concurrency:
  group: publish-blog
  cancel-in-progress: false

env:
  SOURCE_REPO: https://github.com/futuregene/future-os
  # Canonical address of this site: feed, sitemap and canonical tags only. All
  # links inside the build are relative, so the pages themselves are
  # address-independent.
  BASE_URL: https://future-os-blog.github.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the source ref
        id: source
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.ref || github.event.client_payload.ref || 'main' }}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Clone futuregene/future-os
        run: |
          set -euo pipefail
          echo "==> Cloning $SOURCE_REPO@${{ steps.source.outputs.ref }}"
          git clone --depth 1 --branch "${{ steps.source.outputs.ref }}" "$SOURCE_REPO" src

      # The generator and its tests live in the source repository, so this runs
      # exactly what a PR there ran. A broken renderer must not publish.
      - name: Test the generator
        run: PYTHONDONTWRITEBYTECODE=1 python3 src/scripts/test-blog-build.py

      - name: Build the site
        run: |
          set -euo pipefail
          python3 src/scripts/blog/build.py --out site --base-url "$BASE_URL"
          # Optional custom domain: a CNAME file at the root of this repository
          # is copied into the published output.
          if [ -f CNAME ]; then
            cp CNAME site/CNAME
            echo "==> Published with custom domain $(cat CNAME)"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
