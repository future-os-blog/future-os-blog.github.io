name: Publish Blog

# Build blog/ into a static site and deploy it to GitHub Pages
# (https://future-os-blog.github.io).
#
# Pages' source must be set to "GitHub Actions" (Settings → Pages). With
# "Deploy from a branch" GitHub would Jekyll-render the raw markdown sources
# instead of serving this build.
#
# This repository is both the source of the blog and the owner of the site, so
# the build needs no token and no cross-repository clone: the workflow runs the
# same generator and the same tests the sources ship with.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a run that is mid-publish, or Pages can be
# left serving a half-uploaded artifact.
concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The generator is stdlib-only Python, so the runner's stock python3 is
      # the whole toolchain. Tests run first: a broken renderer must not publish.
      - name: Test the generator
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_build.py

      - name: Build the site
        run: |
          set -euo pipefail
          python3 scripts/build.py --out site
          # Optional custom domain: a CNAME file at the root of this repository
          # is copied into the published output.
          if [ -f CNAME ]; then
            cp CNAME site/CNAME
            echo "==> Published with custom domain $(cat CNAME)"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
